spring.application.name=TP3-Observability
# MongoDB Connection (Matches your Docker setup)
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.username=admin
spring.data.mongodb.password=password
spring.data.mongodb.database=tp3_observability
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017

# Logging Configuration
# This ensures your logs are saved to a file for the Parser to read later
logging.file.name=application.json
logging.level.root=INFO